version: "3.8"
services:
  jekyll:
    build: .
    container_name: jekyll-site
    ports:
      - "3000:3000"
      - "35729:35729" # livereload
    volumes:
      - .:/usr/src/app
      - bundle_cache:/usr/local/bundle
    command: bash -lc "bundle check || bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 3000 --livereload"

volumes:
  bundle_cache:
