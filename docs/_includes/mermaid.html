<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // Kramdown wraps fenced code blocks as <pre><code class="language-mermaid">.
  // Mermaid v11 looks for <pre class="mermaid"> — convert them before init.
  document.querySelectorAll('code.language-mermaid').forEach(el => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = el.textContent;
    el.parentElement.replaceWith(pre);
  });

  // Stamp BEM classes onto markdown-generated blockquotes.
  // Kramdown emits plain <blockquote><p> with no classes; the SASS uses
  // .post__blockquote / .post__blockquote__text so we add them here.
  document.querySelectorAll('.post__article--content blockquote').forEach(el => {
    el.classList.add('post__blockquote');
    el.querySelectorAll('p').forEach(p => p.classList.add('post__blockquote__text'));
  });

  mermaid.initialize({
    startOnLoad: true,
    theme: '{{ site.mermaid.theme | default: "dark" }}',
    securityLevel: 'loose'
  });
</script>
